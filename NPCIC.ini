; NPC IC - view the game from a targeted NPC's first-person perspective
; Place this file at: Data/SKSE/Plugins/NPCIC.ini  (next to NPCIC.dll)
; Missing keys use the built-in defaults shown below.
;
; ALL settings live in a SINGLE [General] section below. (An earlier
; two-section layout with a separate [Camera] block caused REX::INI on
; the user's deploy to silently drop the entire second section and fall
; back to C++ defaults for every camera-related key -- including the
; iCameraRotationMode switch. Keeping every key together in [General]
; is the bulletproof workaround.)

[General]
; -----------------------------------------------------------------------------
; Hotkey to toggle NPC view. Value is a Win32 virtual-key code.
; Target the NPC with the game crosshair, then press this key to view from
; its head; press again to return to the player's camera.
; Common values: F1=0x70  F2=0x71  F3=0x72  F4=0x73  F5=0x74  F6=0x75
;                 F7=0x76  F8=0x77  F9=0x78  F10=0x79  F11=0x7A  F12=0x7B
; -----------------------------------------------------------------------------
iToggleHotKey=0x75

; -----------------------------------------------------------------------------
; Hide the target NPC's head while viewing (shrinks the "NPC Head [Head]"
; node to ~0.001 so the head does not block the camera). Restore on detach.
; 1 = hide (recommended), 0 = do not hide
; -----------------------------------------------------------------------------
bHideNpcHead=1

; -----------------------------------------------------------------------------
; Verbose debug logging (per-frame heartbeat, key codes, crosshair RTTI,
; hook-first-invocation, rotation-mode telemetry). Set to 0 once tuning is
; done to quiet the log; load/attach/detach lines always print regardless.
; -----------------------------------------------------------------------------
bDebug=1

; -----------------------------------------------------------------------------
; Auto-target radius (Skyrim units, 1 unit ~= 1.4 cm). When the crosshair has
; no valid NPC on hotkey press the plugin searches this many units around the
; player for the nearest living NPC and attaches to it.
; 50  ~= 70 cm
; 500 ~= 7 m
; 0 or less disables auto-targeting (only the crosshair target is used).
; -----------------------------------------------------------------------------
fAutoTargetRadius=50.0

; -----------------------------------------------------------------------------
; Camera offset relative to the NPC's Head node, applied in VIEW space
; (rotated by the mouse-driven view direction):
;   +X = right,  +Y = forward (in front),  +Z = up
; Start at 0,0,0 and tune so the camera sits at eye level. If the view is
; inside the neck/chest, raise Z; if too far back, lower Y; if shifted left,
; adjust X. Sign conventions follow Skyrim's coordinate system.
; -----------------------------------------------------------------------------
fCameraOffsetX=0.0
fCameraOffsetY=0.0
fCameraOffsetZ=0.0

; -----------------------------------------------------------------------------
; Field of view (degrees) applied while in NPC view. The vanilla world FOV
; is saved on Attach and restored on Detach. <=0 leaves FOV unchanged.
; Typical range 65-90. Lower = zoomed-in look; higher = wide-angle.
; -----------------------------------------------------------------------------
fNpcViewFOV=0.0

; -----------------------------------------------------------------------------
; Camera rotation behavior while viewing an NPC.
;
; 1  = ALWAYS TRACK HEAD ROTATION + accumulative mouse delta.
;      The base rotation every frame equals the NPC head node's CURRENT
;      world rotation (so if the NPC walks/turns/animates a head nod, the
;      camera turns with it just as it did on the first frame). Any mouse
;      input adds a persistent angular OFFSET on top of that live head
;      orientation, so you can still "look around" while the NPC's own
;      view underneath keeps rotating as the NPC moves. With the mouse
;      perfectly still the mode is visually identical to the "snap" phase
;      of mode 2 -- except it never hands off.
;
; 2  = (Default) SNAP TO HEAD on enter, then seamless HANDOFF to pure mouse
;      control. Entering NPC view the first frame rotation is what the NPC
;      is currently facing. As soon as the player moves the mouse enough
;      (>~2 degrees) rotation is handed off to pure mouse control -- but
;      the handoff preserves the head-facing angle at that exact instant
;      as the starting point, so there is NO abrupt jump back to the old
;      player camera angle. Head POSITION anchoring (camera placed at the
;      NPC's head each frame) stays active in both modes.
; -----------------------------------------------------------------------------
iCameraRotationMode=1
